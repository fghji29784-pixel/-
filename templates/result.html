<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>처리 결과</title>
<style>
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background:#f4f5f7; margin:0; padding:40px 16px; }
  .card { max-width:900px; margin:0 auto; background:#fff; border-radius:10px; padding:32px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  h1 { font-size:20px; margin:0 0 8px; }
  .summary { font-size:14px; color:#444; margin-bottom:20px; }
  .summary b { color:#2f6fed; }
  a.download {
    display:inline-block; margin-bottom:24px; padding:10px 18px; background:#2f6fed; color:#fff;
    text-decoration:none; border-radius:6px; font-size:14px; font-weight:600;
  }
  a.download:hover { background:#2559c4; }
  a.back { display:inline-block; margin-left:12px; font-size:13px; color:#666; }
  table.preview-table { border-collapse:collapse; width:100%; font-size:12px; }
  table.preview-table th, table.preview-table td {
    border:1px solid #e2e4e8; padding:6px 8px; text-align:left; white-space:nowrap;
  }
  table.preview-table th { background:#f0f2f5; }
  .preview-wrap { overflow-x:auto; border:1px solid #eee; border-radius:6px; }
</style>
</head>
<body>
  <div class="card">
    <h1>처리 완료</h1>
    <div class="summary">
      원본 <b>{{ total_rows }}</b>행 중 <b>{{ matched_rows }}</b>행이 매칭되었습니다.
    </div>
    <a class="download" href="{{ download_url }}">결과 파일 다운로드</a>
    <a class="back" href="{{ url_for('index') }}">다시 처리하기</a>

    <div class="preview-wrap">
      {{ preview_html | safe }}
    </div>
  </div>
</body>
</html>
